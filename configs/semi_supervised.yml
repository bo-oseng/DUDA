deg_map:
  clear: 0
  OTS: 1
  Outdoor_Rain: 2
  RainDrop: 3
  SPA: 4
  Snow100k: 5
  RainReal: 6
  SnowReal: 7
  UnannotatedHazyImages: 8
incremental:
  stage: 1
  inc_class_num: 3
  base_class_num: 6
cgcd:
  arch: adain
  model_dim: 400
  embd_dim: 324
  nclasses: 9
  model_name: dinov3_vitl16
  pca_path: ${CGCD_DIR}/pca_model.pkl
  scaler_path: ${CGCD_DIR}/scaler_model.pkl
  class_mappings: ${CGCD_DIR}/class_mappings.json
  saved_vcgcd_models_dir: ${CGCD_DIR}
  dino_checkpoint: ${DINO_ADAPTER_DIR}
  class_order: ${FEATURE_DIR}/class_order.txt
model:
  arch: onerestore
  width: 32
train:
  batch_size: 56
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  step_anchor: unlabeled
  total_epoch: 10
  rampup_epoch: 5
  max_train_steps: 22860
  patch_size: 224
  patch_stride: 224
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 0
  ce_weight: 0.01
  l1_weight: 1.0
  use_bf16: false
  stage0_checkpoint: ${STAGE0_CHECKPOINT}
  checkpoint_dir_template: ${OUTPUT_ROOT}/checkpoints/${EXP_NAME}
  checkpoint_name: stage{stage}_latest.pth
  consistency_weight: 0.2
  rampup_steps: 0
  init_validate_on_resume: true
  use_updated_marker_gate: true
  pseudo_update_mode: musiq_then_cgcd
  musiq_warmup_steps: 0
  pseudo_update_margin: 0.0
  vlm_switch_every: 5715
  vlm_metric_schedule: musiq_then_cgcd,musiq_then_cgcd,musiq_then_cgcd,musiq_then_cgcd
  round_mode_policy: hold
  pseudo_round_steps: 5715
  iter_scheduler: true
  cgcd_score_mode: anchor
  cgcd_contrastive_pos_weight: 1.0
  cgcd_contrastive_neg_weight: 1.0
  cgcd_contrastive_tau: 0.7
  cgcd_contrastive_score_temp: 50.0
  cgcd_mahalanobis_temp: 20.0
  cgcd_mahalanobis_pca_top_k: 32
  real_train_root: ${DATA_ROOT}/real_train_patches
  lq_patches_dir: ${DATA_ROOT}/real_train_patches
  pseudo_patches_dir: ${OUTPUT_ROOT}/pseudo_labels/${EXP_NAME}
  force_patchify: false
  max_patches_per_image: 0
  skip_patchify_if_exists: true
  verify_patch_cache: false
  show_patchify_progress: true
  init_pseudo_batch_size: 48
  init_pseudo_num_workers: 4
  init_pseudo_pin_memory: true
  init_pseudo_prefetch_factor: 2
  init_pseudo_persistent_workers: true
  data_root_train: ${DATA_ROOT}/syn_train_dataset
  data_root_val: ${DATA_ROOT}/syn_train_dataset
  input_subdir: input
  gt_subdir: gt
  all_classes:
  - OTS
  - Outdoor_Rain
  - RainDrop
  - SPA
  - Snow100k
  use_validation: false
  use_real_eval: true
  real_eval_root: ${DATA_ROOT}/real_eval_dataset
  real_eval_step_root: ${DATA_ROOT}/real_eval_small_dataset
  real_eval_sets:
  - RealRain_2320
  - RTTS
  - Snow100K_R
  real_eval_max_side: 0
  real_eval_allow_runtime_resize_retry: false
  save_dir: ${OUTPUT_ROOT}/checkpoints
  save_freq: 1
  save_freq_steps: 200
  val_freq: 1
  real_eval_freq_steps: 200
  pseudo_log_freq_steps: 200
  log_dir: ${OUTPUT_ROOT}/tensorboard
  print_freq: 1
  seed: 42
  pseudo_update_cgcd_fallback_margin: 0.0
  semiuir_strong_aug_variant: default
